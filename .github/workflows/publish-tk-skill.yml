name: Publish Latest TK Apparel Skill
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create installable ZIP
        run: |
          test -f tk-apparel-visuals/SKILL.md
          mkdir -p dist
          zip -qr dist/skill.zip tk-apparel-visuals -x '*/__pycache__/*'
          unzip -l dist/skill.zip | grep -q 'tk-apparel-visuals/SKILL.md'
      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view skill-latest >/dev/null 2>&1 || gh release create skill-latest -t "TK Apparel Visuals · Latest" -n "Latest installable TK-US apparel visual skill. Updated on main branch changes."
          gh release upload skill-latest dist/skill.zip --clobber
