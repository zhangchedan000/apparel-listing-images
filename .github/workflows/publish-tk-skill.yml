name: Publish Latest Apparel Plugin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin ZIP
        run: |
          test -f .codex-plugin/plugin.json
          rm -rf build dist && mkdir -p build/plugin/skills/apparel-listing-images dist
          cp -r .codex-plugin build/plugin/
          cp *.md build/plugin/skills/apparel-listing-images/
          (cd build/plugin && zip -qr ../../dist/apparel-listing-images-plugin.zip .)
          unzip -l dist/apparel-listing-images-plugin.zip | grep -q 'skills/apparel-listing-images/SKILL.md'
      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view skill-latest >/dev/null 2>&1 || gh release create skill-latest -t "Apparel Listing Images · Latest" -n "Latest plugin zip, rebuilt on every main update."
          gh release upload skill-latest dist/apparel-listing-images-plugin.zip --clobber
          gh release delete-asset skill-latest skill.zip -y || true
