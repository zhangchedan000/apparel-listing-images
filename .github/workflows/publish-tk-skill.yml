name: Publish Latest TK Apparel Skill
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create installable ZIPs
        run: |
          test -f tk-apparel-visuals/SKILL.md
          test -f .codex-plugin/plugin.json
          mkdir -p dist
          # 1) 单技能包（只含 TK 专项技能）
          zip -qr dist/skill.zip tk-apparel-visuals -x '*/__pycache__/*'
          # 2) ChatGPT 插件包（设置 → 插件 → 上传插件压缩包 用这个）
          rm -rf build && mkdir -p build/plugin/skills/apparel-listing-images
          cp -r .codex-plugin build/plugin/
          cp *.md build/plugin/skills/apparel-listing-images/
          cp -r tk-apparel-visuals build/plugin/skills/apparel-listing-images/
          (cd build/plugin && zip -qr ../../dist/apparel-listing-images-plugin.zip . -x '*/__pycache__/*')
          unzip -l dist/apparel-listing-images-plugin.zip | grep -q '.codex-plugin/plugin.json'
          unzip -l dist/apparel-listing-images-plugin.zip | grep -q 'skills/apparel-listing-images/SKILL.md'
      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view skill-latest >/dev/null 2>&1 || gh release create skill-latest -t "TK Apparel Visuals · Latest" -n "Latest installable apparel listing skill/plugin. Updated on main branch changes."
          gh release upload skill-latest dist/skill.zip dist/apparel-listing-images-plugin.zip --clobber
